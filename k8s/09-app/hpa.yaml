apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: quora-app-hpa
  namespace: quora
  labels:
    app: quora-app
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: quora-app
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 40
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 60
      